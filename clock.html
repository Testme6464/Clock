<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aesthetic Digital Clock</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      overflow: hidden;
    }

    /* Background Animated Glows */
    .circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
    }

    .circle-1 {
      width: 300px;
      height: 300px;
      background: #38bdf8;
      top: 20%;
      left: 30%;
    }

    .circle-2 {
      width: 250px;
      height: 250px;
      background: #818cf8;
      bottom: 20%;
      right: 30%;
    }

    /* Glassmorphism Card Container */
    .clock-card {
      position: relative;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 40px 60px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .time-display {
      font-size: 4rem;
      font-weight: 800;
      color: #f8fafc;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
    }

    .date-display {
      margin-top: 10px;
      font-size: 1.1rem;
      color: #94a3b8;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- Decorative Glow Circles -->
  <div class="circle circle-1"></div>
  <div class="circle circle-2"></div>

  <!-- Clock Container -->
  <div class="clock-card">
    <div class="time-display" id="clock">00:00:00 AM</div>
    <div class="date-display" id="date">Loading Date...</div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();

      // Time format
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';

      hours = hours % 12;
      hours = hours ? hours : 12; // 0 ကို 12 လို့ ပြောင်းရန်
      const strHours = String(hours).padStart(2, '0');

      document.getElementById('clock').textContent = `${strHours}:${minutes}:${seconds} ${ampm}`;

      // Date format
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);
    }

    // Update every 1 second
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
