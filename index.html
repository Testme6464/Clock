  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCKYDqmCo4CCj7USP5wcXPV4elTWuuhnkU",
      authDomain: "spintest-c5cbc.firebaseapp.com",
      databaseURL: "https://spintest-c5cbc-default-rtdb.firebaseio.com",
      projectId: "spintest-c5cbc",
      storageBucket: "spintest-c5cbc.firebasestorage.app",
      messagingSenderId: "101238946203",
      appId: "1:101238946203:web:aa5b16053efcb26cd4093e",
      measurementId: "G-H0P7BD41G8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.submitWithdrawalWithFirebase = function() {
      if (!currentUser) return;

      const method = document.getElementById("payMethod").value;
      const account = document.getElementById("payAccount").value.trim();
      const amount = parseInt(document.getElementById("withdrawAmount").value, 10);

      if (!account) {
        alert("Please enter your Phone or Account number.");
        return;
      }

      if (isNaN(amount) || amount < MIN_WITHDRAW_POINTS) {
        alert(`Minimum withdrawal amount is ${MIN_WITHDRAW_POINTS.toLocaleString()} PTS (1,000 Ks).`);
        return;
      }

      if (amount > totalScore) {
        alert("Insufficient points balance!");
        return;
      }

      const mmkValue = Math.floor((amount / POINT_RATE) * MMK_AMOUNT);
      const reqId = "REQ_" + Date.now();

      totalScore -= amount;
      saveUserScore();
      totalPointsDisplay.textContent = totalScore.toLocaleString();

      const withdrawData = {
        reqId: reqId,
        userId: currentUser.id,
        userName: currentUser.name || "Unknown",
        userEmail: currentUser.email || "No Email",
        method: method,
        account: account,
        amount: amount,
        mmkValue: mmkValue,
        status: "Pending",
        date: new Date().toLocaleDateString()
      };

      set(ref(db, `withdrawals/${currentUser.id}/${reqId}`), withdrawData)
        .then(() => {
          sendTelegramNotificationWithButtons(withdrawData);
          alert(`Withdrawal request for ${mmkValue.toLocaleString()} Ks submitted!`);
          document.getElementById("payAccount").value = "";
          document.getElementById("withdrawAmount").value = "";
          closeWithdrawModal();
        })
        .catch(err => {
          console.error("Firebase Push Error:", err);
          alert("Error submitting request. Please try again.");
        });
    };

    function sendTelegramNotificationWithButtons(details) {
      const message = `🚨 *NEW WITHDRAWAL REQUEST* 🚨\n\n` +
                      `🆔 *Req ID:* \`${details.reqId}\`\n` +
                      `👤 *User Name:* ${details.userName}\n` +
                      `📧 *Email:* ${details.userEmail}\n` +
                      `💳 *Payment Method:* ${details.method}\n` +
                      `📱 *Account/Phone:* \`${details.account}\`\n` +
                      `🪙 *Points:* ${details.amount.toLocaleString()} PTS\n` +
                      `💵 *Amount:* ${details.mmkValue.toLocaleString()} Ks\n` +
                      `📅 *Date:* ${details.date}\n\n` +
                      `🟡 *Status:* Pending`;

      const payload = {
        chat_id: TELEGRAM_CHAT_ID,
        text: message,
        parse_mode: 'Markdown',
        reply_markup: {
          inline_keyboard: [
            [
              { text: "✅ Complete", callback_data: `complete_${details.userId}_${details.reqId}` },
              { text: "❌ Reject", callback_data: `reject_${details.userId}_${details.reqId}` }
            ]
          ]
        }
      };

      fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    }

    window.listenWithdrawalHistory = function() {
      if (!currentUser) return;

      const userHistoryRef = ref(db, `withdrawals/${currentUser.id}`);

      onValue(userHistoryRef, (snapshot) => {
        const data = snapshot.val();
        const historyList = document.getElementById("historyList");
        historyList.innerHTML = "";

        if (data) {
          Object.keys(data).reverse().forEach(key => {
            const item = data[key];
            const isCompleted = item.status === "Completed";
            const statusColor = isCompleted ? "#4ade80" : (item.status === "Rejected" ? "#ef4444" : "#f59e0b");

            historyList.innerHTML += `
              <div class="history-item">
                <span>${item.date} (${item.method})</span>
                <span>${item.mmkValue ? item.mmkValue.toLocaleString() + ' Ks' : item.amount + ' PTS'}</span>
                <span style="color: ${statusColor}; font-weight: bold;">${item.status}</span>
              </div>
            `;
          });
        } else {
          historyList.innerHTML = `<div style="text-align:center; font-size:0.75rem; color:#64748b;">No withdrawal history</div>`;
        }
      });
    };
  </script>
